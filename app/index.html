<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<title>3xt</title>
		<meta name="description" content="" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="styles/styles.css" />
	</head>
	<body id="body1">
		<!--Title Bar-->
		<div id="title-bar">
			<span id="title-bar-label">navbar</span>
			<div id="navbar">
				<ul id="navbar-items">
					<li id="notes" class="active">notes</li>
					<li id="boards">boards</li>
					<li id="grids">grids</li>
				</ul>
			</div>
			<div id="window-controls">
				<button id="btn-minimize">—</button>
				<button id="btn-maximize">•</button>
				<button id="btn-close">×</button>
			</div>
		</div>

		<div id="content">
			<!-- Side Bar-->
			<div id="sidebar">
				<span id="sidebar-label">pages</span>
				<div id="sidebar-list">
					<div id="sidebar-spacer">
						<ul id="notes-list" class="sidebar-list"></ul>
					</div>
					<button id="btn-newnote" class="btn-newitem">> new_page</button>
				</div>
			</div>

			<!--Main-->
			<div id="main">
				<span id="main-label">main</span>
				<div id="note-placeholder">
					please create a <button id="btn-newnote-ph" class="btn-newitem">new page</button> or select an existing page to get started
				</div>
				<span id="note-title">> title: <input type="text" id="note-title-input" /></span>
				<div id="note-editor"></div>
			</div>
		</div>

		<script type="module" src="app.js"></script>
	</body>
</html>
