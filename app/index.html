<!doctype html>

<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<title>3xt</title>
		<meta name="description" content="" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="styles/styles.css" />
	</head>
	<body id="body1">
		<!--Title Bar-->
		<div id="title-bar">
			<span id="title-bar-label">navbar</span>
			<div id="navbar">
				<ul id="navbar-items">
					<li id="notes" class="active">notes</li>
					<li id="boards">boards</li>
					<li id="widgets">widgets</li>
				</ul>
			</div>
			<div id="window-controls">
				<button id="btn-minimize">—</button>
				<button id="btn-maximize">•</button>
				<button id="btn-close">×</button>
			</div>
		</div>

		<!--Pages/Boards-->
		<!--
            - notes will say pages
            - boards will say boards
            - widgets will say grids
            - sessionStorage check for what page you are on
        -->
		<div id="sidebar">
			<span id="sidebar-label">pages</span>
			<div id="sidebar-list">
				<div id="sidebar-spacer">
					<!-- empty space if the user has no files, otherwise filled with whatever is already there-->
				</div>
				<button id="btn-newpage">> new_page</button>
			</div>
		</div>

		<script src="../node_modules/pouchdb/dist/pouchdb.js"></script>
		<script src="utils/utils.js"></script>
		<script src="utils/database/baseDB.js"></script>
		<script src="utils/database/notes.js"></script>
		<script src="utils/database/boards.js"></script>
		<script src="utils/database/boardItems.js"></script>
		<script src="utils/database/widgets.js"></script>
		<script src="utils/database/widgetPages.js"></script>
		<script src="utils/actions/notesPage.js"></script>
		<script src="utils/actions/boardPage.js"></script>
		<script src="utils/actions/widgetPage.js"></script>
		<script src="app.js"></script>
	</body>
</html>
